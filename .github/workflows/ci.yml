name: CI

# Runs once per pull request head and on demand. Merges to main are not re-run: a pull request
# must be up to date with main before it merges (enforced by the main ruleset once the
# repository is public; by the merge procedure until then), so the PR run already tested the
# merged tree. Superseded runs are cancelled, so a re-push never pays for a stale run.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (supply-chain safety in a public repository);
      # Dependabot proposes upgrades monthly, grouped into one pull request.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check --requirement scripts/commons/requirements.txt
      - run: pnpm install --frozen-lockfile
      # The bake codec test decodes real images in a browser, as visitors' browsers do.
      - run: pnpm --filter @tqw/web exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test scripts/ci/*.test.mjs
      - run: pnpm check:content
      - run: pnpm check:public
      - run: pnpm audit:assets
      - run: pnpm build

  core:
    runs-on: ubuntu-latest
    # Core is every spec except explicitly tagged corridor camera/frame diagnostics.
    # New room, accessibility, privacy and interaction specs are required by default.
    # Six smaller shards reduce the 57-minute software-rendered workload; retain setup headroom.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @tqw/web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @tqw/web exec playwright install-deps chromium
      - run: pnpm --filter @tqw/web exec playwright test --grep-invert @extended --shard="$SHARD/6"
        env:
          CI: 'true'
          SHARD: ${{ matrix.shard }}

  extended:
    runs-on: ubuntu-latest
    # These diagnostics run on every PR, keep their assertions and report all failures.
    # They are visible but are deliberately outside the required checks dependency set.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @tqw/web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @tqw/web exec playwright install-deps chromium
      - name: Run corridor camera and frame diagnostics
        run: pnpm --filter @tqw/web exec playwright test --grep @extended --shard="$SHARD/4" --reporter=line,json
        env:
          CI: 'true'
          SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/extended-results.json
      - name: List every extended failure
        if: always()
        env:
          RESULTS_FILE: ${{ runner.temp }}/extended-results.json
        run: node scripts/ci/e2e-summary.mjs "$RESULTS_FILE" >> "$GITHUB_STEP_SUMMARY"

  # The main ruleset requires this exact status name. Missing, cancelled and failed
  # dependencies must all fail the gate, including any unsuccessful core matrix shard.
  checks:
    name: checks
    needs: [unit, core]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        shell: bash
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          CORE_RESULT: ${{ needs.core.result }}
        run: |
          printf 'unit=%s core=%s\n' "$UNIT_RESULT" "$CORE_RESULT"
          test "$UNIT_RESULT" = success
          test "$CORE_RESULT" = success
