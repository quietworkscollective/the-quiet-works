name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TQW_E2E_ANGLE: swiftshader
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check --requirement scripts/commons/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tqw/web exec playwright install --with-deps chromium webkit
      - name: Source gates, build, asset audit, crawlers and render-independent browsers
        run: pnpm ci:fast
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: deterministic-browser-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7

  checks:
    name: checks
    needs: [deterministic]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require deterministic coverage to succeed
        shell: bash
        env:
          DETERMINISTIC_RESULT: ${{ needs.deterministic.result }}
        run: |
          test "$DETERMINISTIC_RESULT" = success
