name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TQW_E2E_ANGLE: swiftshader
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check --requirement scripts/commons/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tqw/web exec playwright install --with-deps chromium webkit
      - name: Source gates, build, asset audit, crawlers and render-independent browsers
        run: pnpm ci:fast
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: deterministic-browser-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7

  checks:
    name: checks
    needs: [deterministic]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require deterministic coverage to succeed
        shell: bash
        env:
          DETERMINISTIC_RESULT: ${{ needs.deterministic.result }}
        run: |
          test "$DETERMINISTIC_RESULT" = success
